# Builds Chess World installers from the private source repo and publishes them here, in this public
# releases-only repo (the source stays private). Runs only by hand for a given tag: installers are normally
# built on the owner's machine, this workflow is the fallback (e.g. macOS). A `vX.Y.Z-beta.N` tag builds the
# closed beta: installers with the licence gate (`--features beta`), marked as a pre-release (never offered by
# the in-app updater). The result is a DRAFT release: check the installers (smoke test in the source repo's
# docs/release.md), then publish it. The in-app updater reads the channel feeds latest-<channel>.json of the fixed
# `channels` release (source docs/release.md, section 7): with the updater key, the `feeds` job writes them from the
# signed Linux .AppImage and Windows -setup.exe (beta tags: beta feed only; other tags: stable and beta) and attaches
# them to the draft; with the `publish_feeds` input it also uploads them to `channels` (uploading is the release
# switch: only do it once the draft is published). Maia-3 weights are never fetched or shipped (user-supplied only).
# Secrets (this repo): CODE_DEPLOY_KEY (read-only deploy key of the source repo); optional TAURI_SIGNING_PRIVATE_KEY +
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater signing and feeds), APPLE_* / WINDOWS_CERTIFICATE* (skipped without them).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag to build, e.g. v0.9.0 or v0.9.0-beta.1"
        required: true
      publish_feeds:
        description: "Also upload the update feeds to the `channels` release (only once the draft is published)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  KIBITZ_SHA256: 71f470bab415399a3f52659f1643eb93c338d86f8edc03d42431ec1ecef100e5  # Kibitz v0 final

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' <<<"$INPUT_TAG"; then echo "::error::bad tag $INPUT_TAG"; exit 1; fi
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.tag != ''
    concurrency:
      group: release-${{ needs.detect.outputs.tag }}-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triples: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
          # The oldest supported Ubuntu: an AppImage runs on distributions with this glibc or newer. 24.04 (glibc
          # 2.39) because the prebuilt ONNX Runtime linked by `ort` needs glibc 2.38 (22.04 fails to link).
          - os: ubuntu-24.04
            triples: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage
          # tauri-build needs the sidecar for both architectures and the universal one.
          - os: macos-latest
            triples: aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      # Closed-beta tags must ship the licence gate: an ungated beta installer would open for anyone.
      BETA_ARGS: ${{ contains(needs.detect.outputs.tag, '-beta.') && '--features beta' || '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ralabarta/chess-world
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
          ref: ${{ env.TAG }}
          path: app
      - uses: actions/checkout@v4
        with:
          repository: ralabarta/chess-world
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
          ref: build-inputs
          path: inputs
      - name: Kibitz weights (sha256-checked)
        run: |
          mkdir -p app/src-tauri/resources
          cp inputs/kibitz.onnx app/src-tauri/resources/
          got=$( (sha256sum app/src-tauri/resources/kibitz.onnx 2>/dev/null || shasum -a 256 app/src-tauri/resources/kibitz.onnx) | cut -d' ' -f1)
          if [ "$got" != "$KIBITZ_SHA256" ]; then echo "::error::kibitz.onnx sha256 $got, pinned $KIBITZ_SHA256"; exit 1; fi
          rm -rf inputs
      - name: Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: release
      - run: npm ci
        working-directory: app
      - name: Stockfish (pinned release, sha256-checked)
        working-directory: app
        run: for t in ${{ matrix.triples }}; do npm run fetch:stockfish -- --target "$t" --force; done
      # Prebuilt era book (src-tauri/resources/era-book.cwb.zst): first use unpacks it in ~1 s instead of
      # building it (17-46 s on min-spec CPUs). Platform-independent data, built with the app's own code.
      - name: Era book
        working-directory: app
        run: bash scripts/build-era-book.sh
      # Built-in Syzygy 3-4-5 tablebases (~940 MiB, every file sha256-pinned by the script).
      - name: Syzygy tablebases
        working-directory: app
        run: node scripts/fetch-syzygy.mjs --out src-tauri/resources/syzygy
      - name: Stockfish nets for NetMode (CC0-1.0, sha256-pinned)
        working-directory: app
        run: |
          if ! command -v sha256sum >/dev/null; then  # macOS: the script calls sha256sum -c --status
            mkdir -p "$RUNNER_TEMP/bin"; printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$RUNNER_TEMP/bin/sha256sum"
            chmod +x "$RUNNER_TEMP/bin/sha256sum"; export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          SFNET_DIR=src-tauri/resources/nets sh scripts/engine/fetch-sf-nets-extra.sh
          rm -f src-tauri/resources/nets/*.part

      - name: Import the Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      # Only secrets that are set reach the build: Tauri treats a set-but-empty variable as "sign with this".
      - name: Signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names="TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ "$RUNNER_OS" = macOS ]; then names="$names APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"; fi
          for n in $names; do
            v="${!n}"
            if [ -n "$v" ]; then { echo "$n<<__SECRET_EOF__"; echo "$v"; echo "__SECRET_EOF__"; } >> "$GITHUB_ENV"; fi
          done
      - name: Release config (bundled models and tables, updater bundles, signing)
        working-directory: app
        run: |
          conf='{"bundle":{"resources":{"resources/kibitz.onnx":"models/kibitz.onnx","resources/syzygy/*":"syzygy/","resources/nets/*":"nets/"}}}'
          if [ "$HAS_UPDATER_KEY" = true ]; then conf=$(jq -c '.bundle.createUpdaterArtifacts = true' <<<"$conf"); fi
          if [ -n "${WINDOWS_CERT_THUMBPRINT:-}" ]; then
            conf=$(jq -c --arg t "$WINDOWS_CERT_THUMBPRINT" '.bundle.windows = {certificateThumbprint: $t, digestAlgorithm: "sha256", timestampUrl: "http://timestamp.digicert.com"}' <<<"$conf")
          fi
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_APPLE_CERT" != true ]; then conf=$(jq -c '.bundle.macOS.signingIdentity = "-"' <<<"$conf"); fi
          echo "$conf" > release.conf.json
          cat release.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          releaseName: Chess World __VERSION__
          releaseBody: "Draft: paste the CHANGELOG section, check the installers (smoke test), then publish."
          releaseDraft: true
          prerelease: ${{ contains(needs.detect.outputs.tag, '-beta.') }}
          args: ${{ matrix.args }} --config release.conf.json ${{ env.BETA_ARGS }}

  # Update feeds (source docs/release.md, section 7) from the signed Linux .AppImage and Windows -setup.exe of the draft.
  feeds:
    needs: [detect, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Updater key present?
        if: env.HAS_UPDATER_KEY != 'true'
        run: echo '::notice::No TAURI_SIGNING_PRIVATE_KEY secret - unsigned build, no update feeds written or uploaded.'
      - uses: actions/checkout@v4
        if: env.HAS_UPDATER_KEY == 'true'
        with:
          repository: ralabarta/chess-world
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
          ref: ${{ env.TAG }}
          path: app
          sparse-checkout: scripts/updater-feed.sh
          sparse-checkout-cone-mode: false
      - name: Write the feeds
        if: env.HAS_UPDATER_KEY == 'true'
        run: |
          version=${TAG#v}
          channels=stable,beta
          if [[ $TAG == *-beta.* ]]; then channels=beta; fi  # a beta never reaches the stable feed
          mkdir feed
          gh release download "$TAG" --dir feed --pattern '*.AppImage.sig' --pattern '*-setup.exe.sig'
          for s in feed/*.sig; do touch "${s%.sig}"; done  # the script only needs the bundle names and their .sig
          bash app/scripts/updater-feed.sh --dir feed --version "$version" --tag "$TAG" --channels "$channels" \
            --notes "See https://github.com/$GH_REPO/releases/tag/$TAG"
          gh release upload "$TAG" feed/latest-*.json --clobber
      - name: Publish the feeds to the channels release
        if: env.HAS_UPDATER_KEY == 'true' && inputs.publish_feeds
        run: gh release upload channels feed/latest-*.json --clobber
